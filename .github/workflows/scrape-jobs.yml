name: Scrape video production leads

on:
  schedule:
    # Every day at 11:17 UTC (~6-7am US Eastern).
    - cron: "17 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s scraper/tests

      - name: Scrape
        env:
          # All optional: each source/feature turns on when its secrets exist.
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Application / proposal drafts (Claude). Drafting is off without a key.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPLICANT_PROFILE: ${{ secrets.APPLICANT_PROFILE }}
          MAX_DRAFTS_PER_RUN: ${{ vars.MAX_DRAFTS_PER_RUN }}
        run: python scraper/scrape.py

      # Drafts hold your personal details, so they are never committed. They are
      # emailed (SMTP secrets). Artifacts on a PUBLIC repo can be downloaded by
      # anyone, so this upload only runs if you set the repository variable
      # UPLOAD_DRAFTS=true -- do that only if the repo is private.
      - name: Upload drafts
        if: always() && vars.UPLOAD_DRAFTS == 'true' && hashFiles('drafts/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: application-drafts-${{ github.run_id }}
          path: drafts/
          retention-days: 90

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add jobs/jobs.json jobs/feed.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update video production leads $(date -u +%F)"
            git push
          fi
